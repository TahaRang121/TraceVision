version: '3.8'

services:
  # ── Relational Database ────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: tracevision-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tracevision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount schema.sql so tables are created automatically on first run
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracevision"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Vector Search Engine ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: tracevision-qdrant
    restart: always
    ports:
      - "6333:6333" # HTTP REST API and Web Dashboard
      - "6334:6334" # gRPC Interface
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata: